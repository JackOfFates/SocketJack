<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocketJack Telemetry Lab</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#151824;color:#e6edf7;font-family:Inter,Segoe UI,sans-serif;min-height:100vh}
    header{padding:1.2rem 2rem;background:linear-gradient(120deg,#252a40,#191d2d);border-bottom:1px solid #3c4562} h1{margin:0;font-size:1.55rem} header p{margin:.35rem 0 0;color:#9aa8c7}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;padding:1rem 2rem}.metric{padding:1rem;background:#22283a;border:1px solid #343c56;border-radius:10px}.metric span{display:block;font-size:.76rem;color:#9aa8c7;text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;margin-top:.25rem;font-size:1.35rem}
    .controls{margin:0 2rem 1rem;padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;background:#202638;border:1px solid #343c56;border-radius:10px}.controls label{color:#b8c4df}.controls select,.controls button{border:1px solid #4a5678;border-radius:6px;background:#161b29;color:#e6edf7;padding:.52rem .72rem}.controls button{cursor:pointer;background:#3858a8}.controls button:hover{background:#456aca}.status{margin-left:auto;color:#7ee2ae;font-size:.88rem}
    .charts{display:grid;grid-template-columns:1.4fr 1fr;gap:1rem;padding:0 2rem 2rem}.panel{background:#202638;border:1px solid #343c56;border-radius:12px;padding:1rem;min-width:0}.panel h2{font-size:1rem;margin:0 0 .7rem;color:#cbd6ee}.panel canvas{display:block;width:100%;height:300px;background:#181d2b;border-radius:7px}
    @media(max-width:800px){.charts{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.controls{flex-wrap:wrap}.status{width:100%;margin-left:0}}
  </style>
</head>
<body>
  <header><h1>SocketJack Telemetry Lab</h1><p>Live-shaped pseudo telemetry for transport health and request volume.</p></header>
  <section class="metrics" aria-label="Telemetry summary">
    <div class="metric"><span>Average latency</span><strong id="avgLatency">-- ms</strong></div>
    <div class="metric"><span>Peak throughput</span><strong id="peakThroughput">-- req/s</strong></div>
    <div class="metric"><span>Error rate</span><strong id="errorRate">--%</strong></div>
  </section>
  <section class="controls">
    <label for="dataset">Dataset</label>
    <select id="dataset"><option value="0">Production (Live)</option><option value="3">Development (Simulated)</option><option value="7">Staging (Mixed)</option></select>
    <button id="regenerate" type="button">Regenerate data</button>
    <output id="status" class="status" aria-live="polite">Dataset ready</output>
  </section>
  <main class="charts">
    <section class="panel"><h2>Latency trend · last 36 intervals</h2><canvas id="latencyChart" aria-label="Latency line chart"></canvas></section>
    <section class="panel"><h2>Throughput distribution</h2><canvas id="throughputChart" aria-label="Throughput bar chart"></canvas></section>
  </main>
  <script src="/src/main.ts" type="module"></script>
</body>
</html>
